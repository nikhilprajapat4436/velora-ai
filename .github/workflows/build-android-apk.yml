name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-android-apk.yml"
      - ".env.android"
      - "android/**"
      - "capacitor.config.json"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "public/**"
      - "scripts/build-android.mjs"
      - "src/**"
      - "vite.config.js"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Configure persistent Android signing key when available
        if: ${{ env.ANDROID_DEBUG_KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_DEBUG_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_DEBUG_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_DEBUG_KEY_PASSWORD }}
        run: |
          for name in KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "Missing Android signing secret: $name" >&2
              exit 1
            fi
          done
          KEYSTORE_PATH="$RUNNER_TEMP/velora-debug.keystore"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          echo "ANDROID_DEBUG_KEYSTORE=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "ANDROID_DEBUG_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ANDROID_DEBUG_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "ANDROID_DEBUG_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci

      - name: Build and sync Android web assets
        run: npm run build:android

      - name: Assemble installable test APK
        run: bash android/gradlew --no-daemon -p android assembleDebug

      - name: Report Google Sign-In certificate fingerprint
        env:
          APK_PATH: android/app/build/outputs/apk/debug/app-debug.apk
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          APKSIGNER="$(find "$SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          if [ -z "$APKSIGNER" ]; then
            echo "Could not find Android SDK apksigner." >&2
            exit 1
          fi
          SHA1="$("$APKSIGNER" verify --print-certs "$APK_PATH" | sed -n 's/^Signer #1 certificate SHA-1 digest: //p')"
          if [ -z "$SHA1" ]; then
            echo "Could not read the APK signing certificate fingerprint." >&2
            exit 1
          fi
          {
            echo "## Android Google Sign-In setup"
            echo "- Android package: com.velora.ai"
            echo "- APK signing SHA-1: $SHA1"
            if [ -z "${ANDROID_DEBUG_KEYSTORE:-}" ]; then
              echo "- This run used GitHub's temporary debug key. Configure the four ANDROID_DEBUG_KEYSTORE_* repository secrets to keep the fingerprint stable across future APKs."
            else
              echo "- Persistent signing key detected; this fingerprint remains stable across builds."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: VeloraAI-debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish the latest test APK download
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          APK_PATH: android/app/build/outputs/apk/debug/app-debug.apk
          RELEASE_TAG: android-v${{ github.run_number }}
        run: |
          gh release create "$RELEASE_TAG" "$APK_PATH#VeloraAI.apk" \
            --title "Velora AI Android $RELEASE_TAG" \
            --notes "Installable debug-signed test APK. Android may ask you to allow this browser to install apps. Remove the previous test build before installing a future build." \
            --latest
